packages:
  - "apps/*"
  - "packages/*"

# argon2 (apps/api) ściąga prebuilt binarkę przez node-gyp-build.
# Next.js (apps/web) potrzebuje natywnych zależności (sharp, unrs-resolver)
# z build scriptami — jawnie zezwalamy im na budowanie przy instalacji.
allowBuilds:
  # Telemetria swagger-ui-dist — nie chcemy, żeby instalacja coś wysyłała.
  '@scarf/scarf': false
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
