services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finso
      POSTGRES_PASSWORD: finso
      POSTGRES_DB: finso
    ports:
      - "5432:5432"
    # Postgres 18+ przechowuje dane pod ścieżką z numerem wersji
    # (żeby wspierać pg_ctlcluster-style upgrade'y) — montujemy
    # katalog nadrzędny, nie .../data, inaczej entrypoint się wywala.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finso -d finso"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
