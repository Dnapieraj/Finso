name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# prisma.config.ts requires DATABASE_URL even for `prisma generate` (run on
# install), which never connects. CI has no .env, so it gets a dummy URL;
# jobs that need a real database must set their own.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

# TODO(2026-10): ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026. Check that
# both jobs stay green (especially `playwright install --with-deps chromium`);
# pin `ubuntu-24.04` temporarily if the new image breaks them.
jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint, typecheck, test
        run: pnpm turbo run lint typecheck test

  web-e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Web imports @vireo/shared from dist/, so its dependencies are built
      # first; the Playwright web server then builds and starts web itself.
      - name: Build web dependencies
        run: pnpm turbo run build --filter=web^...

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter web test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
